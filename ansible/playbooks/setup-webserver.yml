---
- name: Configurar servidores web con SSL
  hosts: webservers
  become: yes
  vars:
    domain_name: "{{ ansible_host }}"
    
  tasks:
    - name: Actualizar repositorios
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    - name: Instalar paquetes
      apt:
        name:
          - nginx
          - openssl
          - curl
          - htop
        state: present
        
    - name: Crear directorio para certificados
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: '0755'
        
    - name: Obtener IP pública
      command: curl -s ifconfig.me
      register: public_ip
      changed_when: false
      delegate_to: localhost
      run_once: yes
      
    - name: Generar certificado autofirmado
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/ssl/selfsigned.key
        -out /etc/nginx/ssl/selfsigned.crt
        -subj "/C=CL/ST=Santiago/L=Santiago/O=ProyectoHA/CN={{ public_ip.stdout }}"
      args:
        creates: /etc/nginx/ssl/selfsigned.crt
      notify: restart nginx
      
    - name: Configurar Nginx con SSL
      template:
        src: nginx-ssl.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: restart nginx
      
    - name: Crear página web personalizada
      template:
        src: index.html.j2
        dest: /var/www/html/index.html
        
    - name: Verificar configuración
      command: nginx -t
      register: nginx_test
      
    - name: Mostrar resultado
      debug:
        msg: "{{ nginx_test.stdout }}"
        
  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
